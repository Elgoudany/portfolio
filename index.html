<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1A2332"><link rel="icon" href="img/icon-192.png"><link rel="apple-touch-icon" href="img/icon-192.png"></head><body>
<title>Hamza Elgoudany</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: a home "tableau de bord" (slate band + menu of rooms), each room opens as its own page via #hash.
   Light working sheets for content, the slate band returns for hero, CalTrack showcase and contact. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#141C28; --muted:#566275; --line:#D8DEE7;
  --accent:#0B7A58; --accent-ink:#FFFFFF; --accent-soft:#DDF0E8; --signal:#A8690F;
  --band:#1A2332; --band-2:#222D40; --band-fg:#EEF2F7; --band-muted:#A3B2C5; --band-line:#34425A; --band-accent:#62D6A9;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --arabic:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --quote-ar:"Amiri","Traditional Arabic",serif;
  --r:14px; --wrap:1140px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151E; --surface:#171F2C; --ink:#E7ECF3; --muted:#97A5B8; --line:#2A3547;
  --accent:#52CB9F; --accent-ink:#0C1A15; --accent-soft:#16332B; --signal:#E0A645;
  --band:#141C29; --band-2:#1C2636; --band-fg:#EEF2F7; --band-muted:#A3B2C5; --band-line:#2F3C52; --band-accent:#62D6A9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151E; --surface:#171F2C; --ink:#E7ECF3; --muted:#97A5B8; --line:#2A3547;
  --accent:#52CB9F; --accent-ink:#0C1A15; --accent-soft:#16332B; --signal:#E0A645;
  --band:#141C29; --band-2:#1C2636; --band-fg:#EEF2F7; --band-muted:#A3B2C5; --band-line:#2F3C52; --band-accent:#62D6A9; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--band)}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-0.015em}
p{margin:0} ul{margin:0;padding:0;list-style:none} figure{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.band :focus-visible,.nav :focus-visible,.dark :focus-visible{outline-color:var(--band-accent)}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
img{display:block}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--band);color:var(--band-fg);border-bottom:1px solid var(--band-line)}
.nav .wrap{display:flex;align-items:center;gap:16px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:17px;text-decoration:none;white-space:nowrap}
.brand i{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--band-accent);color:#0C1A15;font-style:normal;font-size:13px;font-weight:800}
.links{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{font-size:14px;text-decoration:none;color:var(--band-muted);padding:7px 11px;border-radius:999px;white-space:nowrap;transition:color .15s,background .15s}
.links a:hover{color:var(--band-fg)}
.links a[aria-current="page"]{color:var(--band-fg);background:var(--band-2)}
.lang{display:flex;border:1px solid var(--band-line);border-radius:999px;padding:3px;gap:2px;flex:none}
.lang button{font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:5px 10px;border-radius:999px;color:var(--band-muted)}
.lang button[aria-pressed="true"]{background:var(--band-fg);color:var(--band)}
.menu-btn{display:none;align-items:center;gap:8px;font-size:14px;color:var(--band-fg);border:1px solid var(--band-line);border-radius:999px;padding:6px 12px;margin-left:auto}
@media (max-width:980px){.links{display:none}.menu-btn{display:inline-flex}}
@media (max-width:480px){.brand span{display:none}.nav .wrap{gap:10px}}

/* home band */
.band{background:var(--band);color:var(--band-fg);position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--band-line) 1px,transparent 1.2px);background-size:26px 26px;opacity:.5;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}
.hero{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:48px;align-items:center;padding-block:60px 40px}
.eyebrow{color:var(--band-accent);display:flex;flex-wrap:wrap;gap:6px 14px}
.eyebrow b{font-weight:500;color:var(--band-muted)}
.hero h1{font-size:clamp(34px,5.4vw,62px);line-height:1.04;font-weight:700;margin-top:18px;max-width:16ch}
.hero h1 em{font-style:normal;color:var(--band-accent)}
.lede{color:var(--band-muted);font-size:17px;max-width:60ch;margin-top:20px}
.lede strong{color:var(--band-fg);font-weight:500}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;transition:transform .15s,border-color .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--band-accent);color:#0C1A15}
.btn.ghost{border:1px solid var(--band-line);color:var(--band-fg)}
.btn.line{border:1px solid var(--line);color:var(--ink)}
.portrait{position:relative;width:min(240px,48vw);aspect-ratio:1;max-width:100%}
.portrait img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid var(--band-2)}
.portrait::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px dashed var(--band-line)}
.portrait span{position:absolute;right:-6px;bottom:14px;background:var(--band-2);border:1px solid var(--band-line);border-radius:999px;padding:6px 12px;font-size:12.5px;display:flex;gap:7px;align-items:center;white-space:nowrap}
.portrait span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--band-accent)}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:40px 28px}.portrait{order:-1;width:132px}.portrait span{right:auto;left:104px;bottom:8px}}
.stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--band-line)}
.stats{position:relative}
.stat{text-align:left;color:inherit;padding:22px 18px 22px 0;display:grid;align-content:start;gap:0;transition:background .15s}
.stat+.stat{padding-left:18px;border-left:1px solid var(--band-line)}
.stat:hover .more,.stat[aria-expanded="true"] .more{color:var(--band-accent)}
.stat .more{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--band-muted);margin-top:10px;display:inline-flex;gap:5px;align-items:center;opacity:.8}
.stat[aria-expanded="true"] .more svg{transform:rotate(180deg)}
.bubble.up::before{top:auto;bottom:-7px}
.band .bubble{background:var(--band-2);border-color:var(--band-line)}
.band .bubble::before{background:var(--band-2)}
.stlist{display:grid;gap:0;border-top:1px solid var(--band-line)}
.stlist li{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:12px;padding:7px 0;border-bottom:1px solid var(--band-line);font-size:13.5px}
.stlist li:last-child{border-bottom:0}
.stats .stlist b{font-family:var(--body);font-weight:600;font-size:13.5px;line-height:1.4;display:block}
.stats .bubble h4{font-size:17px}
.stlist span{color:var(--band-muted)}
.stats b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(28px,3.6vw,42px);line-height:1;font-variant-numeric:tabular-nums}
.stats b small{font-size:.5em;color:var(--band-accent);margin-left:2px}
.stats span{display:block;color:var(--band-muted);font-size:13.5px;margin-top:8px;line-height:1.4}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(3){padding-left:0;border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--band-line)}}

/* home menu */
.rooms{padding-block:56px 72px}
.rooms-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.rooms-head h2{font-size:clamp(26px,3.2vw,36px)}
.rooms-head p{color:var(--muted);max-width:52ch}
.grid-rooms{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.room{grid-column:span 4;position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-height:200px;padding:20px;border-radius:18px;border:1px solid var(--line);background:var(--surface);text-decoration:none;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.room:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 14px 30px -18px rgba(10,30,50,.35)}
.room .num{position:absolute;top:18px;left:20px;color:var(--muted)}
.room .go{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);transition:background .2s,color .2s,border-color .2s}
.room:hover .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.room h3{font-size:22px;line-height:1.15}
.room p{color:var(--muted);font-size:14.5px;line-height:1.45}
.room.wide{grid-column:span 8}
.room.img{color:#fff;border:0;min-height:260px}
.room.img::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,22,.05) 25%,rgba(8,14,22,.82));z-index:1}
.room.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.room.img:hover img{transform:scale(1.04)}
.room.img h3,.room.img p,.room.img blockquote{position:relative;z-index:2}.room.img .num,.room.img .go{z-index:2}.room.img .num{background:rgba(8,14,22,.6);padding:3px 8px;border-radius:6px;top:14px;left:16px}
.room.img p,.room.img .num{color:rgba(255,255,255,.82)}
.room.img .go{border-color:rgba(255,255,255,.45)}
.room.dark{background:var(--band);border-color:var(--band-line);color:var(--band-fg)}
.room.dark p,.room.dark .num{color:var(--band-muted)}
.room.dark .go{border-color:var(--band-line)}
.room.dark:hover .go{background:var(--band-accent);color:#0C1A15;border-color:var(--band-accent)}
.room.quote-room{background:var(--accent-soft);border-color:transparent}
.room.quote-room blockquote{margin:28px 0 0;font-family:var(--quote-ar);font-size:24px;line-height:1.5;direction:rtl;text-align:right;color:var(--ink)}
.bricks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:36px}
.bricks button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;padding:20px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);transition:border-color .15s,background .15s,color .15s}
.bricks button:hover{border-color:var(--accent)}
.bricks button[aria-selected="true"]{background:var(--band);color:var(--band-fg);border-color:var(--band)}
.bricks .bn{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:var(--accent)}
.bricks button[aria-selected="true"] .bn{color:var(--band-accent)}
.bricks b{display:block;font-family:var(--display);font-size:20px;line-height:1.2}
.bricks span.s{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.bricks button[aria-selected="true"] span.s{color:var(--band-muted)}
.bricks .tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.bricks button[aria-selected="true"] .tag{border-color:var(--band-line);color:var(--band-muted)}
.brick-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start;margin-bottom:28px;max-width:80ch}
.brick-head .bn{font-family:var(--display);font-weight:800;font-size:48px;line-height:.9;color:var(--line)}
.brick-head .mono{color:var(--accent)}
.brick-head h3{font-size:clamp(24px,3vw,32px);line-height:1.15;margin-top:6px}
.brick-head p:last-child{color:var(--muted);margin-top:8px}
@media (max-width:700px){.bricks{grid-template-columns:minmax(0,1fr)}.bricks .tag{display:none}.brick-head .bn{font-size:36px}}
.skwrap{position:relative}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{display:grid;justify-items:start;gap:14px;padding:20px 18px;border-radius:18px;border:1px solid var(--line);background:var(--surface);text-align:left;transition:transform .18s,border-color .18s,box-shadow .18s;min-height:150px;align-content:space-between}
.tile:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 14px 28px -20px rgba(10,30,50,.4)}
.tile[aria-expanded="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.tile .ill{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);transition:transform .2s}
.tile:hover .ill{transform:rotate(-4deg) scale(1.05)}
.tile.soft .ill{background:color-mix(in srgb,var(--signal) 16%,transparent);color:var(--signal)}
.tile b{font-family:var(--display);font-size:17px;line-height:1.2;font-weight:600}
.tile small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted);margin-top:4px;text-transform:uppercase}
.bubble{position:absolute;z-index:5;width:min(360px,calc(100% - 8px));border:1px solid var(--band-line);background:var(--band);color:var(--band-fg);border-radius:16px;padding:18px;box-shadow:0 24px 50px -20px rgba(0,0,0,.55);display:grid;gap:10px}
.bubble::before{content:"";position:absolute;top:-7px;left:var(--ax,40px);width:14px;height:14px;background:var(--band);transform:rotate(45deg);border-radius:2px}
.bubble h4{font-size:18px;padding-right:30px}
.bubble p{color:var(--band-muted);font-size:14.5px;line-height:1.5}
.bubble .x{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1px solid var(--band-line);display:grid;place-items:center;color:var(--band-fg)}
.bubble .go-row{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;border-top:1px solid var(--band-line)}
.bubble .go-row a{display:inline-flex;align-items:center;gap:8px;padding:7px 11px 7px 7px;border-radius:12px;background:var(--band-2);border:1px solid var(--band-line);text-decoration:none;font-size:13.5px;transition:border-color .15s}
.bubble .go-row a:hover{border-color:var(--band-accent)}
.bubble .go-row a i{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--band-accent);color:#0C1A15;font-style:normal;flex:none}
#tiles-soft{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.tiles,#tiles-soft{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.tiles,#tiles-soft{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:130px;padding:16px}.tile .ill{width:46px;height:46px}
 .bubble{position:fixed;left:max(12px,env(safe-area-inset-left,0px))!important;right:max(12px,env(safe-area-inset-right,0px));top:auto!important;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto}
 .bubble::before{display:none}}
.mission.flash{animation:flash 2.4s ease}
@keyframes flash{0%,30%{background:var(--accent-soft);border-color:var(--accent)}100%{background:transparent}}
.room.full{grid-column:span 12;min-height:150px}
.group-label{display:flex;align-items:center;gap:14px;margin:0 0 14px;color:var(--muted)}
.group-label::after{content:"";flex:1;height:1px;background:var(--line)}
.group-label b{font-family:var(--display);font-size:20px;color:var(--ink);font-weight:700;letter-spacing:-0.01em}
.group-gap{height:40px}
.room.beyond{background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%)}
.sec-title{display:grid;gap:8px;margin:72px 0 26px;max-width:72ch}
.sec-title .mono{color:var(--accent)}
.sec-title h3{font-size:clamp(24px,3vw,32px);line-height:1.15}
.sec-title p{color:var(--muted)}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.ba>div{border-radius:18px;padding:24px;display:grid;gap:16px;align-content:start}
.ba .before{background:var(--surface);border:1px solid var(--line)}
.ba .after{background:var(--band);color:var(--band-fg);border:1px solid var(--band-line)}
.ba h4{font-size:19px}
.ba .mono{color:var(--muted)}
.ba .after .mono{color:var(--band-accent)}
.steps-row{display:grid;gap:8px}
.steps-row li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start}
.steps-row li i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;border:1.5px solid var(--line);color:var(--muted)}
.ba .after .steps-row li i{border-color:var(--band-line);color:var(--band-accent)}
.ba .after .steps-row li.hl i{background:var(--band-accent);border-color:var(--band-accent);color:#0C1A15}
.steps-row b{display:block;font-weight:600}
.steps-row span{font-size:14.5px;color:var(--muted)}
.ba .after .steps-row span{color:var(--band-muted)}
.ba .out{border-top:1px solid var(--line);padding-top:12px;font-size:14.5px;color:var(--muted)}
.ba .after .out{border-color:var(--band-line);color:var(--band-fg)}
.gains{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.gains div{border-top:2px solid var(--accent);padding-top:14px;display:grid;gap:6px}
.gains h4{font-size:17px}
.gains p{color:var(--muted);font-size:15px}
.learned{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.learned span.l{font-size:14px;color:var(--muted);margin-right:4px}
.learned b{font-weight:500;font-size:14px;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.pullquote{margin-top:28px;padding:22px 24px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 14px 14px 0;font-family:var(--display);font-size:clamp(18px,2.2vw,22px);line-height:1.4;max-width:70ch}
@media (max-width:860px){.ba{grid-template-columns:minmax(0,1fr)}.gains{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.room,.room.wide{grid-column:span 6}}
@media (max-width:600px){.room,.room.wide{grid-column:span 12}.room{min-height:170px}.room.img{min-height:220px}}

/* pages */
.page{padding-block:44px 80px}
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:26px;flex-wrap:wrap}
.crumb a{font-size:14px;color:var(--muted);text-decoration:none;display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.crumb a:hover{color:var(--ink);border-color:var(--accent)}
.crumb span{color:var(--muted)}
